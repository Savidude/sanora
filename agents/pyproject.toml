[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-designer"
version = "0.0.1"
description = "Story designer agent"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore",
    "boto3>=1.35",
    "uvicorn",
    "langchain-aws>=0.2",
    "langgraph>=1.1.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sanora-contracts",
    "typing-extensions>=4.0",
    "aws-opentelemetry-distro>=0.18.0",
]

[tool.uv.sources]
sanora-contracts = { path = "../packages/sanora-contracts" }

[tool.setuptools.packages.find]
where = ["."]
