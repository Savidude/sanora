[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-designer"
version = "0.0.1"
description = "Story designer agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.3",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
