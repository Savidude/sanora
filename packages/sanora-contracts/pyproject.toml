[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanora-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Sanora services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
